name: DGX Spark fork release

# Builds the fork's binaries and attaches them to a GitHub release.
# Trigger by pushing a tag like `dgx-v0.21.2-1`, or run it manually.
# Binaries are built with `no_self_update` so `update` can't replace them
# with upstream releases.

on:
  push:
    tags:
      - "dgx-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. dgx-v0.21.2-1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.repository_owner != 'henrygd' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Build web UI
        run: |
          bun install --no-save --cwd ./internal/site
          bun run --cwd ./internal/site build

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -tags testing ./agent/ ./internal/records/

      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          build() { # component os arch
            local name=$1 pkg=$2 os=$3 arch=$4 out="dist/$1_$3_$4"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -tags no_self_update -ldflags "-w -s" -o "$out/$name" "./internal/cmd/$pkg"
            cp LICENSE supplemental/dgx-spark/README.md "$out/"
            tar -C "$out" -czf "$out.tar.gz" .
            rm -rf "$out"
          }
          for arch in arm64 amd64; do
            build beszel-agent agent linux $arch
            build beszel hub linux $arch
            build beszel hub darwin $arch
          done
          cp supplemental/dgx-spark/install-user-services.sh supplemental/dgx-spark/install-macos-hub.sh dist/
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "DGX Spark thermal fork $TAG" \
            --notes "Unofficial Beszel fork for NVIDIA DGX Spark. See supplemental/dgx-spark/README.md for install steps and limitations. Self-update is disabled in these builds."
